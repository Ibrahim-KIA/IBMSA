name: Keep Render service awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's 15-minute idle sleep
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://ibmsa.onrender.com/api/demo-status
